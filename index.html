<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="설계기준 라이브러리 — 제철플랜트 건축 설계검토용 강재 단중표, 강재 규격, 제철 프로세스와 설비 약어, KDS·KCS 설계기준 바로가기">
<meta name="theme-color" content="#24415f">
<link rel="icon" type="image/png" sizes="32x32" href="lib-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="lib-icon-192.png">
<link rel="apple-touch-icon" href="lib-apple-touch-icon.png">
<title>설계기준 라이브러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#18202b; --sub:#566273; --line:#d7dde4;
  --steel:#24415f; --steel-ink:#ffffff; --accent:#c4561d; --accent-soft:#fbeee6; --link:#24415f;
  --ok:#1d7a4a; --okbg:#e3f3ea; --warn:#9a5b00; --warnbg:#fdf1dc; --hl:#fff1a8; --water:#2f6fa8;
  --f-display:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --ok:#5cc98c; --okbg:#173326; --warn:#e8a94a; --warnbg:#38290f; --hl:#5a4b10; --water:#7fb4e6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --ok:#5cc98c; --okbg:#173326; --warn:#e8a94a; --warnbg:#38290f; --hl:#5a4b10; --water:#7fb4e6; color-scheme:dark }
*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:48px}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;background:var(--steel);color:var(--steel-ink);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.search{display:flex;gap:6px;flex:1 1 260px;min-width:0}
.search input{flex:1;min-width:0;padding:7px 10px;border-radius:6px;border:0;background:#fff;color:#18202b}
.sis{font-size:12.5px;opacity:.85;white-space:nowrap}
.sis a{color:inherit}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:14px;box-shadow:inset 0 -2px 0 var(--line);position:sticky;top:var(--topH,54px);z-index:4;background:var(--bg);padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:820px){ .top{position:relative} .tabs{top:0} }
.tab{flex:0 0 auto;padding:9px 14px 8px;cursor:pointer;border:0;background:transparent;color:var(--sub);font-family:var(--f-display);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-weight:400;font-size:11.5px;margin-left:5px;color:var(--sub)}
.hero{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:end}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(24px,4.2vw,34px);line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:8px 0 0;color:var(--sub);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:96px}
.fact b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--steel)}
.card .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.card h3{margin:0;font-family:var(--f-display);font-size:17px}
.card p{margin:0;font-size:13px;color:var(--sub)}
.sec{margin-top:26px}
.sec h2{margin:0 0 4px;font-family:var(--f-display);font-size:19px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.panel h3{margin:0 0 6px;font-family:var(--f-display);font-size:15px}
.panel ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.note{font-size:13px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 12px;margin-top:12px}
.muted{color:var(--sub);font-size:13px}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink)}
.chip.on{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.75}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.shead{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between;margin-top:18px}
.shead h2{margin:0;font-family:var(--f-display);font-size:20px}
.shead p{margin:2px 0 0;color:var(--sub);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.btn:hover{border-color:var(--steel)}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}

/* 표: 내용 폭만큼만 (넓게 퍼지지 않게) */
.tbl-wrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:fit-content;max-width:100%}
table.t{border-collapse:collapse;font-size:14px}
.t th,.t td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--surface2);font-family:var(--f-display);font-weight:600;font-size:12.5px;color:var(--sub);z-index:1}
.t td:first-child,.t th:first-child{text-align:left;font-family:var(--f-mono);font-size:13.5px}
.t td.num{font-family:var(--f-mono)}
.t td.dm{font-family:var(--f-mono);font-size:13px;color:var(--sub)}
.t th.dm{font-family:var(--f-mono);color:var(--accent)}
.t th.sep,.t td.sep{border-left:1px solid var(--line)}
.t.pick tbody tr{cursor:pointer}
.t.pick tbody tr:hover{background:var(--surface2)}
.t tbody tr.sel{background:var(--accent-soft)}

/* 단중표 */
.djtop{display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(220px,270px);gap:12px;margin-top:12px;align-items:stretch}
.djtop .panel{margin-top:0}
@media (max-width:940px){ .djtop{grid-template-columns:minmax(0,1fr) 250px} .djtop #calc{grid-column:1 / -1} }
@media (max-width:700px){ .djtop{grid-template-columns:1fr} }
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fhead h3{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub)}
.fld .k{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:5px}
.fld input,.fld select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-size:15px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.secfig{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.secfig figcaption{font-size:12.5px;color:var(--sub);text-align:center;margin-top:2px}
.secsvg{width:100%;max-width:250px;height:auto;display:block}
svg .sh{fill:var(--surface2);stroke:var(--ink);stroke-width:1.6;fill-rule:evenodd}
svg .wl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .dim line{stroke:var(--sub);stroke-width:1}
svg .dim .ext{stroke-dasharray:2 2;stroke-width:.8}
svg .dim .tk{stroke-width:1.6}
svg .dim text{fill:var(--sub);font:600 13px var(--f-mono)}
svg .dim.on line{stroke:var(--accent)}
svg .dim.on text{fill:var(--accent)}
svg .pt{fill:var(--accent);font:600 11.5px var(--f-body)}
svg .ld{stroke:var(--accent);stroke-width:1}
svg .cap{fill:var(--sub);font:11px var(--f-body)}
.djgrid{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;align-items:flex-start}
.djgrid .tbl-wrap{max-height:none}
.djgrid .t th{position:static;white-space:normal;line-height:1.25;vertical-align:bottom}
.djgrid .t th,.djgrid .t td{padding:5px 8px}
.djgrid .t td:first-child{font-size:13px}
.cnt-line{font-size:12.5px;color:var(--sub);margin:14px 0 0}
/* 강재 규격: 가운데 정렬, 용어 설명 */
.gcard .t th,.gcard .t td,.gcard .t th:first-child,.gcard .t td:first-child{text-align:center}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 18px;margin:8px 0 0}
.gloss div{font-size:13.5px;line-height:1.6}
.gloss b{display:inline-block;min-width:64px;font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.gloss .old{font-family:var(--f-mono);font-size:12.5px}
.calc{display:grid;gap:8px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.calc input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);width:100%}
.calc .sel{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-weight:500}
.res{display:grid;gap:4px;margin-top:6px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.res b{font-family:var(--f-mono);font-size:18px;color:var(--accent)}
.res label{display:inline-flex;flex-direction:row;gap:6px;align-items:center;color:var(--ink);font-size:13px}
details.sc{margin-top:12px}
details.sc summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px}
details.sc .tbl-wrap{margin-top:8px;max-height:none}
details.sc ol{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--sub)}

/* 약어 */
.abl{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.abl li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.abl li:last-child{border-bottom:0}
.abl .k{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.abl .tg{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--surface2);color:var(--sub);white-space:nowrap;cursor:pointer;border:0}
@media (max-width:560px){ .abl li{grid-template-columns:84px minmax(0,1fr)} .abl .tg{grid-column:2;justify-self:start} }

/* 버튼형 하위 메뉴 */
.psub{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.psub button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13.5px;color:var(--ink);text-align:left}
.psub button small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--sub)}
.psub button .n{font-family:var(--f-mono);color:var(--accent);font-size:11.5px;margin-right:5px}
.psub button.on{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.psub button.on small,.psub button.on .n{color:inherit;opacity:.8}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.gcard .h{padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line)}
.gcard .h b{font-family:var(--f-display);font-size:16px}
.gcard .h span{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.gcard .h p{margin:0;width:100%;font-size:12.5px;color:var(--sub)}
.gcard .tbl-wrap{border:0;border-radius:0;max-height:none}

/* 제철 프로세스 */
.ovw,.stg{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ovw svg{display:block;width:100%;min-width:780px;height:auto}
.stg svg{display:block;width:100%;min-width:600px;max-width:820px;margin:0 auto;height:auto}
.pn{cursor:pointer}
.pn rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.pn:hover rect{stroke:var(--steel)}
.pn .no{fill:var(--accent);font:500 11px var(--f-mono)}
.pn .nm{fill:var(--ink);font:700 14px var(--f-display)}
.pn .sb{fill:var(--sub);font:11px var(--f-body)}
.pn.on rect{fill:var(--steel);stroke:var(--steel)}
.pn.on .nm,.pn.on .sb,.pn.on .no{fill:var(--steel-ink)}
svg .ar{stroke:var(--sub);stroke-width:1.6;fill:none}
svg .ar2{stroke:var(--sub);stroke-width:1.3;fill:none;stroke-dasharray:4 3}
svg .ahs{fill:var(--sub)}
svg .ahp{fill:var(--accent)}
svg .lb3{fill:var(--sub);font:11.5px var(--f-body)}
svg .ub{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
svg .ut{fill:var(--ink);font:600 13px var(--f-display)}
svg .pr{fill:var(--okbg);stroke:var(--ok);stroke-width:1.2}
svg .prt{fill:var(--ink);font:600 12.5px var(--f-display)}
svg .eq{fill:var(--surface2);stroke:var(--ink);stroke-width:1.5}
svg .ht{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg .ln{stroke:var(--ink);stroke-width:1.5;fill:none}
svg .fa{stroke:var(--accent);stroke-width:2.2;fill:none}
svg .wt{stroke:var(--water);stroke-width:1.5;fill:none}
svg .wf{fill:var(--water);opacity:.25}
svg .lb{fill:var(--ink);font:600 12.5px var(--f-body)}
svg .lb2{fill:var(--sub);font:11px var(--f-body)}
.stage-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.stage-h h3{margin:0;font-family:var(--f-display);font-size:19px}
.stage-h .no{font-family:var(--f-mono);color:var(--accent)}
.stage-h .en{font-family:var(--f-mono);color:var(--sub);font-size:13px}
.easy{margin-top:8px;font-size:15.5px}
.like{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.like b{color:var(--accent);margin-right:6px}
.io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin-top:12px}
.io .bx{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.io .bx b{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.io .bx.out{background:var(--okbg);border-color:transparent}
.io .bx div{font-size:14px}
.io .to{font-size:22px;color:var(--accent)}
@media (max-width:560px){ .io{grid-template-columns:1fr} .io .to{transform:rotate(90deg);justify-self:center} }
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;counter-reset:s}
.steps span{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13.5px;counter-increment:s}
.steps span::before{content:counter(s) ". ";font-family:var(--f-mono);color:var(--accent)}
.steps i{color:var(--sub);font-style:normal}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){ .two{grid-template-columns:1fr} }
.panel.arch{border-left:4px solid var(--accent)}
.abchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.abchip{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:2px 8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.abchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.abdesc{margin-top:8px;font-size:14px;min-height:1.5em}

/* 바로가기 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.links a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--steel)}
.links b{font-family:var(--f-display)} .links small{display:block;color:var(--sub);margin-top:3px;font-size:12.5px}
.code{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 14px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.code:last-child{border-bottom:0}
.code .k{font-family:var(--f-mono);font-size:13.5px;color:var(--accent)}
.code small{display:block;color:var(--sub);font-size:12.5px}
@media (max-width:560px){ .code{grid-template-columns:1fr} }
.sres h3{margin:18px 0 6px;font-family:var(--f-display);font-size:14px;color:var(--sub);display:flex;gap:10px;align-items:center}
.sres h3::after{content:"";flex:1;height:1px;background:var(--line)}
.hit{display:flex;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.hit:hover{border-color:var(--steel)}
.hit .k{font-family:var(--f-mono);font-weight:500;min-width:96px;color:var(--accent)}
.hit .v{flex:1;min-width:0;font-size:14px}
.hit .x{font-family:var(--f-mono);font-size:12.5px;color:var(--sub);white-space:nowrap}
.more{font-size:13px;color:var(--sub);margin:2px 0 0}
/* 단중 계산 */
.ctop{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
.ctop .panel{margin-top:0}
@media (max-width:700px){ .ctop{grid-template-columns:1fr} }
.eqline{margin:4px 0 0;font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);border-radius:6px;padding:6px 10px}
.ctbl{margin-top:12px;max-height:none}
.ctbl .t th{white-space:normal;vertical-align:bottom;line-height:1.25;position:static}

"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[×*]/g,"x").replace(/\s+/g,"");
function hl(text, q){
  const t = esc(text); if(!q) return t;
  const words = q.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/x/gi,"[x×*]"));
  if(!words.length) return t;
  try { return t.replace(new RegExp("(" + words.join("|") + ")","gi"), "<mark>$1</mark>"); } catch(e){ return t; }
}
const fmt = (n, d=3) => n == null ? "−" : (+n).toLocaleString("ko-KR",{maximumFractionDigits:d});

/* ═════════ 단면 도식 (SVG) ═════════ */

// 가로 치수선: x1~x2, 높이 y, 보조선은 ext(모양 끝 y)에서

  let s = `<g class="dim" data-k="${k}">`;
  if(o.ext!=null){ const d = o.ext < y ? 5 : -5; s += `<line class="ext" x1="${x1}" y1="${o.ext}" x2="${x1}" y2="${y+d}"/><line class="ext" x1="${x2}" y1="${o.ext}" x2="${x2}" y2="${y+d}"/>`; }
  s += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>${tk(x1,y)}${tk(x2,y)}`;
  return s + `<text x="${o.lx ?? (x1+x2)/2}" y="${o.ly ?? (y+16)}" text-anchor="${o.a || "middle"}">${lab}</text></g>`;
}
function dV(y1,y2,x,lab,k,o={}){
  let s = `<g class="dim" data-k="${k}">`;
  if(o.ext!=null){ const d = o.ext > x ? -5 : 5; s += `<line class="ext" x1="${o.ext}" y1="${y1}" x2="${x+d}" y2="${y1}"/><line class="ext" x1="${o.ext}" y1="${y2}" x2="${x+d}" y2="${y2}"/>`; }
  s += `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>${tk(x,y1)}${tk(x,y2)}`;
  return s + `<text x="${o.lx ?? (x-7)}" y="${o.ly ?? ((y1+y2)/2+4)}" text-anchor="${o.a || "end"}">${lab}</text></g>`;

const part = (x,y,tx,ty,lab,a="start") => `<line class="ld" x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/><circle cx="${x}" cy="${y}" r="2" class="wl"/><text class="pt" x="${tx + (a==="start"?3:-3)}" y="${ty+4}" text-anchor="${a}">${lab}</text>`;

      + part(150,31,170,12,"플랜지") + part(123,110,96,118,"웨브","end")

function searchAll(q){
  const n = norm(q); if(!n) return null;
  const words = q.trim().toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  const m = s => { const t = norm(s); return words.every(w => t.includes(w)); };
  const out = {dj:[], ab:[], gr:[], pr:[], cd:[], cad:[]};
  DJG.forEach(g => g.rows.forEach(row => { if(m(row.r[0]) || m(g.n + " " + row.r[0])) out.dj.push({g, r:row.r}); }));
  ABBR.forEach(a => { if(m(a[0] + " " + a[1])) out.ab.push(a); });
  out.tm = []; (window.TERMS||[]).forEach(t => { if(m(t.join(" "))) out.tm.push(t); });
  GR.forEach((g,gi) => g.rows.forEach(r => { if(m(r[0] + " " + g.ks + " " + g.g)) out.gr.push({g, gi, r}); }));
  PROC.forEach(p => { const txt = [p.name,p.en,p.easy,p.like,...p.in,...p.out,...p.flow,...p.facts,...p.arch].join(" "); if(m(txt)) out.pr.push(p); });
  (window.CAD||[]).forEach(g => g.rows.forEach(r => { if(m(r.join(" ") + " " + g.g)) out.cad.push({g, r, x:"cad"}); }));
  (window.XL||[]).forEach(g => g.rows.forEach(r => { if(m(r.join(" ") + " " + g.g + " 엑셀")) out.cad.push({g, r, x:"excel"}); }));
  CODES.forEach(c => c.items.forEach(i => { if(m(i.join(" "))) out.cd.push(i); }));
  SRCS.forEach(s => { if(m(s.n + " " + s.d)) out.cd.push([s.n, s.d]); });
  (window.LINKS||[]).forEach(g => g.items.forEach(s => { if(m(s.n + " " + s.d + " " + g.g)) out.cd.push([s.n, s.d]); }));
  out.ab.sort((a,b) => (norm(b[0])===n) - (norm(a[0])===n));
  return out;
}

  if(r.gr.length) h += `<h3>강재 규격 ${r.gr.length}</h3>` + lim(r.gr, 10, ({g,gi,r:row}) => `<button class="hit" data-go="struct" data-sub="grades/${gi}"><span class="k">${hl(row[0],q)}</span><span class="v">${esc(g.g)} · ${esc(g.ks)}</span><span class="x">${esc(row.slice(1).filter(Boolean).join(" / "))}</span></button>`);
  if(r.pr.length) h += `<h3>제철 프로세스 ${r.pr.length}</h3>` + lim(r.pr, 8, p => `<button class="hit" data-go="process" data-sub="${p.id}"><span class="k">${p.no}</span><span class="v"><b>${esc(p.name)}</b> — ${hl(p.easy,q)}</span></button>`);
  if(r.cad.length) h += `<h3>도구 (캐드·엑셀) ${r.cad.length}</h3>` + lim(r.cad, 12, ({g,r:row,x}) => `<button class="hit" data-go="tools" data-sub="${x}"><span class="k">${hl(row[0],q)}</span><span class="v">${hl(row[2],q)}</span><span class="x">${esc(row[1]||g.g)}</span></button>`);

  return h + "</div>";
}

function sample(g,k){ const r = g.rows[Math.min(g.rows.length-1, Math.floor(g.rows.length/2))]; if(!r) return ""; const i = g.f.findIndex(f=>f[0]===k); return r.n[i] ?? ""; }
function djHead(g){
  let h = `<th>규격</th>` + g.f.map(([k],i)=>`<th class="dm${i===0?" sep":""}">${k}</th>`).join("") + `<th class="sep">단중<br>${unitW(g)}</th>`;
  if(g.paint) h += `<th>도장<br>${g.u==="m2"?"m²/m²":"m²/m"}</th>`;
  if(g.extra) h += `<th>${g.extra}</th>`;
  if(g.k!=="W" && g.k!=="AB") h += `<th>할증<br>품셈</th>`;
  return h;
}
function djFilter(g){
  const conds = g.f.map(([k],i)=>[i, parseFloat(String(S.ff[k]??"").replace(",","."))]).filter(([,v])=>!isNaN(v));
  return g.rows.map((row,i)=>[row,i]).filter(([row]) =>
    conds.every(([i,v]) => row.n[i]!=null && Math.abs(row.n[i]-v) < 1e-6) &&
    (!g.wtype || !S.wt || row.r[0].toUpperCase().endsWith(S.wt)));
}
function fillDjBody(){
  const g = curG(), grid = $("#djgrid"); if(!grid) return;
  const rows = djFilter(g);
  $("#djcnt").textContent = rows.length === g.rows.length ? `${g.n} 전체 ${g.rows.length}개` : `${g.rows.length}개 중 ${rows.length}개`;
  const span = g.f.length + 2 + (g.paint?1:0) + (g.extra?1:0) + (g.k!=="W"&&g.k!=="AB"?1:0);
  const rowHtml = ([row,i]) => {
    const r = row.r, rt = rate(g,row);
    let c = `<td>${esc(r[0])}${window.DJ_CHECK && window.DJ_CHECK.has(g.k+"|"+r[0]) ? `<span class="chk" title="KS 표준 규격에서 찾을 수 없음 — 값 확인 필요">확인 필요</span>` : ""}</td>` + g.f.map((f,j)=>`<td class="dm${j===0?" sep":""}">${row.n[j]!=null?fmt(row.n[j]):"−"}</td>`).join("") + `<td class="num sep">${fmt(r[1],4)}</td>`;

    if(g.extra) c += `<td class="num">${r[2]==null?"−":fmt(r[2],3)}</td>`;
    if(g.k!=="W" && g.k!=="AB") c += `<td class="num" title="${rt?esc(rt[1]):"표준품셈 해당 항목 없음"}">${rt?rt[0]+"%":"−"}</td>`;
    return `<tr data-i="${i}" class="${i===S.sel?"sel":""}">${c}</tr>`;
  };
  const head = `<thead><tr>${djHead(g)}</tr></thead>`;
  const draw = k => { const per = Math.ceil(rows.length / k); let out = "";
    for(let c = 0; c < k; c++){ const part = rows.slice(c*per, (c+1)*per); if(!part.length) break; out += `<div class="tbl-wrap"><table class="t pick">${head}<tbody>${part.map(rowHtml).join("")}</tbody></table></div>`; }
    grid.innerHTML = out; };
  if(!rows.length){ grid.innerHTML = `<div class="tbl-wrap"><table class="t">${head}<tbody><tr><td colspan="${span}" class="muted" style="font-family:var(--f-body)">조건에 맞는 규격이 없습니다. 칸 값을 확인하거나 초기화하세요.</td></tr></tbody></table></div>`; fillCalc(); return; }
  draw(1);
  if(rows.length > 10){ const w = grid.firstElementChild.offsetWidth, avail = grid.clientWidth;
    const k = Math.max(1, Math.min(3, Math.floor((avail + 12) / (w + 12)), Math.ceil(rows.length / 6))); if(k > 1) draw(k); }
  fillCalc();
}
let djResizeT; window.addEventListener("resize", () => { clearTimeout(djResizeT); djResizeT = setTimeout(() => { if(S.tab==="danjung" && !$("#q").value.trim()) fillDjBody(); }, 150); });

function bindCalc(){
  const g = curG(), row = g.rows[S.sel]; if(!row) return; const r = row.r, rt = rate(g,row);
  const upd = () => {
    const L = $("#c-len") ? (parseFloat($("#c-len").value) || 0) : 1, Q = $("#c-qty") ? (parseFloat($("#c-qty").value) || 0) : 1;

}

const TERMS = window.TERMS || [], TCATS = window.TERM_CATS || {};

  <ul class="abl" id="ablist"></ul>`;

function fillAbbr(){
  const q = S.abq, words = q.trim().toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  if(S.ab==="terms"){
    const list = TERMS.filter(t => (!S.tc || t[3]===S.tc) && words.every(w => norm(t.join(" ")).includes(w)));

    $("#ablist").innerHTML = list.length ? cats.map(c => { const xs = list.filter(t=>t[3]===c); return xs.length ? `<h3 class="subh">${esc(TCATS[c])}</h3><div class="tgrid">${xs.map(t=>`<div class="tcard"><div class="tk">${hl(t[0],q)}</div><div class="te">${hl(t[1],q)}</div><p>${hl(t[2],q)}</p></div>`).join("")}</div>` : ""; }).join("") : `<p class="muted">찾는 용어가 없습니다.</p>`;
    return;
  }
  let list = ABBR.filter(a => (!S.ab || a[2]===S.ab) && (!S.al || a[0][0].toUpperCase()===S.al) && words.every(w => norm(a[0]+" "+a[1]).includes(w)));
  const n = norm(q); if(n) list.sort((a,b) => (norm(b[0])===n) - (norm(a[0])===n) || (norm(b[0]).startsWith(n)) - (norm(a[0]).startsWith(n)));

const mk = id => `<defs><marker id="${id}s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahs"/></marker><marker id="${id}p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahp"/></marker></defs>`;
function overview(sel){
  const W = 118, H = 64, Y = 78, xs = [16,150,284,418,552,686];
  const sub = {raw:"하역·저장", sinter:"원료 덩어리화", iron:"쇳물 만들기", steel:"강으로·굳히기", hot:"늘이기", cold:"얇게·도금"};
  const order = ["raw","sinter","iron","steel","hot","cold"];
  const flowLb = ["철광석·석탄","소결광·코크스","용선 (쇳물)","슬래브","열연코일 (일부)"];
  let s = `<svg viewBox="0 0 960 268" role="img" aria-label="제철 전체 공정 흐름도">${mk("ov")}`;
  // 전기로 경로
  s += `<rect x="418" y="8" width="118" height="30" rx="6" class="ub"/><text class="ut" x="477" y="28" text-anchor="middle">고철 → 전기로</text><path class="ar2" d="M477 38 V${Y-2}" marker-end="url(#ovs)"/>`;
  order.forEach((id,i) => {
    const p = PROC.find(x=>x.id===id); const x = xs[i];
    s += `<g class="pn${sel===id?" on":""}" data-pr="${id}" tabindex="0" role="button" aria-label="${p.name}"><rect x="${x}" y="${Y}" width="${W}" height="${H}" rx="8"/><text class="no" x="${x+10}" y="${Y+17}">${p.no}</text><text class="nm" x="${x+W/2}" y="${Y+37}" text-anchor="middle">${p.name.replace(" (고로)","")}</text><text class="sb" x="${x+W/2}" y="${Y+54}" text-anchor="middle">${sub[id]}</text></g>`;
    if(i < order.length-1){ const x1 = x+W, x2 = xs[i+1]; s += `<path class="ar" d="M${x1+2} ${Y+H/2} H${x2-3}" marker-end="url(#ovs)"/><text class="lb3" x="${(x1+x2)/2}" y="${Y-8}" text-anchor="middle">${flowLb[i]}</text>`; }
  });
  // 제품
  s += `<path class="ar" d="M${xs[5]+W+2} ${Y+H/2} H818" marker-end="url(#ovs)"/>`;
  s += `<rect x="820" y="${Y-18}" width="128" height="100" rx="8" class="pr"/><text class="prt" x="884" y="${Y+2}" text-anchor="middle">제품</text>`;
  ["열연코일·후판","선재·형강","냉연·도금강판","전기강판·STS"].forEach((t,i)=>{ s += `<text class="lb3" x="884" y="${Y+22+i*16}" text-anchor="middle">${t}</text>`; });
  s += `<path class="ar" d="M${xs[4]+W/2} ${Y-2} V${Y-30} H872 V${Y-21}" marker-end="url(#ovs)"/><text class="lb3" x="750" y="${Y-36}" text-anchor="middle">후판·선재·열연코일은 바로 제품으로</text>`;
  // 에너지·환경
  const uy = 214;
  s += `<g class="pn${sel==="util"?" on":""}" data-pr="util" tabindex="0" role="button" aria-label="에너지·환경"><rect x="16" y="${uy}" width="788" height="44" rx="8"/><text class="no" x="28" y="${uy+27}">07</text><text class="nm" x="60" y="${uy+28}">에너지·환경</text><text class="sb" x="180" y="${uy+28}">부생가스로 발전 · 산소·용수 공급 · 집진·수처리</text></g>`;
  [[150,"COG"],[284,"BFG"],[418,"LDG"]].forEach(([x,t])=>{ s += `<path class="ar2" d="M${x+W/2} ${Y+H+2} V${uy-3}" marker-end="url(#ovs)"/><text class="lb3" x="${x+W/2+6}" y="${Y+H+42}">${t}</text>`; });
  s += `<path class="ar2" d="M706 ${uy-2} V${Y+H+3}" marker-end="url(#ovs)"/><text class="lb3" x="712" y="${Y+H+42}">전기·산소·물</text>`;
  return s + `</svg>`;
}

function procTable(cur){
  const T = window.PROC_TABLE || []; if(!T.length) return "";
  let h = "", i = 0;
  while(i < T.length){ const g = T[i][0]; let j = i; while(j < T.length && T[j][0]===g) j++;
    for(let k=i;k<j;k++){ const r = T[k]; h += `<tr class="${r[5]===cur?"cur":""}" data-pr="${r[5]}" tabindex="0">${k===i?`<td class="grp" rowspan="${j-i}">${esc(g)}</td>`:""}<td class="nw"><b>${esc(r[1])}</b></td><td class="txt">${esc(r[2])}</td><td class="txt">${esc(r[3])}</td><td class="txt">${esc(r[4])}</td></tr>`; }
    i = j; }
  return `<div class="panel"><h3>공정별 주요 설비 · 들어가는 것 · 나오는 것 <span class="muted" style="font-weight:400;font-size:13px">— 줄을 누르면 해당 공정 설명으로 갑니다</span></h3><div class="tbl-wrap wide"><table class="t ctr ptbl2"><thead><tr><th>구분</th><th>공정</th><th style="min-width:220px">주요 설비</th><th style="min-width:180px">들어가는 것 (Input)</th><th style="min-width:220px">나오는 것 · 제품 (Output)</th></tr></thead><tbody>${h}</tbody></table></div></div>`;
}

const curC = () => CALCS.find(c => c.id === S.cc) || CALCS[0];
const crows = c => { if(!Array.isArray(S.cr[c.id])) S.cr[c.id] = c.def.map(x => ({...x})); if(!S.cr[c.id].length) S.cr[c.id].push(Object.fromEntries(c.f.map(([k]) => [k, ""]))); return S.cr[c.id]; };
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g,"")); return isNaN(n) ? null : n; };

}

function fillCalcTable(){

function updCalcRow(i){

  $("#cw"+i).textContent = res && res.w!=null ? fmt(res.w, 2) : "−";
  let tot = 0; crows(c).forEach(rw => { const q = calcRow(c, rw); if(q && q.w!=null) tot += q.w; });
  $("#ctot").textContent = fmt(tot, 2) + (tot >= 1000 ? `  (${fmt(tot/1000,3)} ton)` : "");
}

function fillCad(){
  const q = (S.cadq||"").trim(), words = q.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
  const qq = norm(q), ascii = /^[a-z0-9+→\/ ]+$/i.test(q);
  const hit = r => { if(!qq) return true; if(ascii){ const keys = r[0].toLowerCase().split("/").map(s=>s.replace(/\s+/g,"")); return keys.some(k => k===qq || k.startsWith(qq)) || norm(r[1]).startsWith(qq) || norm(r[2]).includes(qq); } return words.every(w => norm(r.join(" ")).includes(w)); };
  const html = ((S.tl==="excel" ? window.XL : window.CAD)||[]).map(g => { const rows = g.rows.filter(r => hit(r) || (!ascii && words.every(w => norm(g.g).includes(w))));
    if(!rows.length) return ""; return `<div class="cadcard"><h3>${esc(g.g)}</h3><table class="t cadt"><tbody>${rows.map(r=>`<tr><td><kbd>${hl(r[0],q)}</kbd></td><td class="txt">${hl(r[2],q)}${r[1]?`<span class="cmdn">${hl(r[1],q)}</span>`:""}</td></tr>`).join("")}</tbody></table></div>`; }).join("");
  $("#cadgrid").innerHTML = html || `<p class="muted">찾는 단축키가 없습니다.</p>`;
}

  const need = l && u ? Math.max(0, Math.ceil(l * (1/u - p.ri - p.ro) * 1000)) : null;
  $("#ur"+i).textContent = R ? fmt(R,3) : "−"; $("#uu"+i).textContent = U ? fmt(U,3) : "−";
  const j = $("#uj"+i); j.innerHTML = U && u ? (U <= u ? `<span class="okb">만족</span>` : `<span class="ngb">부족</span>`) : "−";
  $("#un"+i).textContent = need!=null ? fmt(need,0) : "−";
}

/* ═════════ 계산: 오수·배수량 ═════════ */
const FX = window.FIXTURES || [];
const SW_DEF = [{r:"대기실", f:"대변기", n:"5", q:"15", c:"9", h:"8"}, {r:"대기실", f:"소변기", n:"2", q:"5", c:"16", h:"8"}, {r:"대기실", f:"세면기", n:"1", q:"10", c:"9", h:"8"}, {r:"대기실", f:"싱크", n:"2", q:"15", c:"9", h:"8"}, {r:"대기실", f:"샤워", n:"4", q:"60", c:"3", h:"8"}];
function wrows(){ if(!Array.isArray(S.cr.sewer)) S.cr.sewer = SW_DEF.map(x=>({...x})); if(!S.cr.sewer.length) S.cr.sewer.push({r:"", f:"대변기", n:"", q:"15", c:"9", h:"8"}); return S.cr.sewer; }
function sewerBody(){
  return `<p class="muted" style="margin:12px 0 0">실별로 위생기구 수를 넣으면 하루 오수·배수량을 계산합니다. 기구를 바꾸면 사용량·횟수가 예시값으로 바뀝니다 (직접 수정 가능).</p>
  <div class="tbl-wrap ctbl wide"><table class="t"><thead><tr><th>실 이름</th><th>기구</th><th class="in">기구 수<small>개</small></th><th class="in">1회 사용량<small>ℓ</small></th><th class="in">사용 횟수<small>회/h</small></th><th class="in">사용시간<small>h/일</small></th><th class="sep">구분</th><th>하루 사용량<small>ℓ/일</small></th><th></th></tr></thead><tbody id="wbody"></tbody></table></div>
  <div class="tools"><button class="btn" id="wadd">+ 줄 추가</button><button class="btn" id="wreset">예시로 되돌리기</button><button class="btn" id="wclear">모두 지우기</button></div>
  <div class="res3" id="wsum"></div>
  <div class="panel"><h3>기구별 사용량 예시</h3><div class="tbl-wrap wide" style="margin-top:6px"><table class="t ctr"><thead><tr><th>기구</th><th>구분</th><th>1회 사용량 (ℓ)</th><th>시간당 사용 횟수</th></tr></thead><tbody>${FX.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="num">${x[2]}</td><td class="num">${x[3]}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h3>계산 방법</h3><ul>${(window.SEWER_NOTES||[]).map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>${calcLinks("sewer")}`;
}
function fillSewer(){
  const body = $("#wbody"); if(!body) return;
  body.innerHTML = wrows().map((r,i)=>`<tr><td class="in"><input type="text" class="wide-in" data-wr="${i}" data-wk="r" value="${esc(r.r ?? "")}" autocomplete="off"></td>
    <td><select data-wr="${i}" data-wk="f">${FX.map(x=>`<option${x[0]===r.f?" selected":""}>${esc(x[0])}</option>`).join("")}</select></td>
    ${["n","q","c","h"].map(k=>`<td class="in"><input type="text" inputmode="decimal" data-wr="${i}" data-wk="${k}" value="${esc(r[k] ?? "")}" autocomplete="off"></td>`).join("")}
    <td class="sep" id="wt${i}"></td><td class="num main" id="wv${i}"></td><td><button class="btn sm" data-wdel="${i}" title="이 줄 삭제">×</button></td></tr>`).join("");
  wrows().forEach((_,i)=>updW(i));
}
function wcalc(r){ const fx = FX.find(x=>x[0]===r.f), n = num(r.n), q = num(r.q), c = num(r.c), h = num(r.h); const v = n!=null && q!=null && c!=null && h!=null ? n*q*c*h : null; return {t: fx ? fx[1] : "", v, h}; }
function updW(i){
  const res = wcalc(wrows()[i]);
  $("#wt"+i).textContent = res.t; $("#wv"+i).textContent = res.v!=null ? fmt(res.v,0) : "−";
  let o = 0, b = 0, oh = 0; wrows().forEach(r => { const q = wcalc(r); if(q.v==null) return; if(q.t==="오수"){ o += q.v; if(q.h) oh += q.v / q.h; } else b += q.v; });
  $("#wsum").innerHTML = `<div class="rb"><span>오수</span><b>${fmt(o,0)}</b> ℓ/일</div><div class="rb"><span>배수</span><b>${fmt(b,0)}</b> ℓ/일</div><div class="rb"><span>합계</span><b>${fmt(o+b,0)}</b> ℓ/일</div><div class="rb hi"><span>정화조 검토용 (오수만)</span><b>${fmt(oh,0)}</b> ℓ/h</div>`;
}

/* ═════════ 계산 입력 이벤트 (할증·열관류율·오수) ═════════ */
document.addEventListener("input", e => {
  const l = e.target.closest?.("input[data-lk]"); if(l){ lab()[l.dataset.lk] = l.value; saveCalc(); fillLabor(); return; }
  const u = e.target.closest?.("input[data-uk]"); if(u){ urows()[+u.dataset.ur][u.dataset.uk] = u.value; saveCalc(); updU(+u.dataset.ur); return; }
  const w = e.target.closest?.("input[data-wk]"); if(w){ wrows()[+w.dataset.wr][w.dataset.wk] = w.value; saveCalc(); updW(+w.dataset.wr); return; }
});
document.addEventListener("change", e => {
  const u = e.target.closest?.("select[data-uk]");
  if(u){ const i = +u.dataset.ur, r = urows()[i]; r[u.dataset.uk] = u.value;
    if(u.dataset.uk==="m"){ const x = INS[+u.value]; if(x && x[1]!=="") r.l = String(x[1]); }
    if(u.dataset.uk==="p"){ const p = UP.find(x=>x.id===r.p); if(p && p.u) r.u = p.u; }
    saveCalc(); fillU(); return; }
  const w = e.target.closest?.("select[data-wk]");
  if(w){ const r = wrows()[+w.dataset.wr]; r.f = w.value; const fx = FX.find(x=>x[0]===r.f); if(fx){ r.q = String(fx[2]); r.c = String(fx[3]); } saveCalc(); fillSewer(); return; }
});
document.addEventListener("click", e => {
  if(e.target.closest("#lreset")){ S.cr.labor = {...LABOR_DEF}; saveCalc(); render(); return; }
  if(e.target.closest("#lclear")){ S.cr.labor = {}; saveCalc(); render(); return; }
  if(e.target.closest("#uadd")){ const rs = urows(); rs.push({...(rs[rs.length-1] || U_DEF[0])}); saveCalc(); fillU(); return; }
  if(e.target.closest("#ureset")){ S.cr.uval = U_DEF.map(x=>({...x})); saveCalc(); fillU(); return; }
  if(e.target.closest("#uclear")){ S.cr.uval = [{p:"wd", m:"0", l:"", d:"", u:""}]; saveCalc(); fillU(); return; }
  const ud = e.target.closest("[data-udel]"); if(ud){ urows().splice(+ud.dataset.udel,1); saveCalc(); fillU(); return; }
  if(e.target.closest("#wadd")){ const rs = wrows(); rs.push({...(rs[rs.length-1] || SW_DEF[0])}); saveCalc(); fillSewer(); return; }
  if(e.target.closest("#wreset")){ S.cr.sewer = SW_DEF.map(x=>({...x})); saveCalc(); fillSewer(); return; }
  if(e.target.closest("#wclear")){ S.cr.sewer = [{r:"", f:"대변기", n:"", q:"15", c:"9", h:"8"}]; saveCalc(); fillSewer(); return; }
  const wd = e.target.closest("[data-wdel]"); if(wd){ wrows().splice(+wd.dataset.wdel,1); saveCalc(); fillSewer(); return; }
});

/* ═════════ 렌더 ═════════ */
function bindLocal(sel, fn){
  const el = $(sel); if(!el) return; let comp = false;
  el.addEventListener("compositionstart", () => comp = true);
  el.addEventListener("compositionend", () => { comp = false; fn(el.value); });
  el.addEventListener("input", () => { if(!comp) fn(el.value); });
}
function render(){
  renderTabs();
  const q = $("#q").value.trim(), v = $("#view");
  if(q){ v.innerHTML = renderSearch(q); return; }
  if(S.tab==="home") v.innerHTML = renderHome();
  else if(S.tab==="danjung"){ v.innerHTML = renderDanjung(); bindFinder(); fillDjBody(); }
  else if(S.tab==="abbr"){ v.innerHTML = renderAbbr(); fillAbbr(); bindLocal("#abq", val => { S.abq = val; fillAbbr(); }); }
  else if(S.tab==="process"){ v.innerHTML = renderProcess(); fillPrDesc(); }

  else if(S.tab==="codes") v.innerHTML = renderCodes();
  else if(S.tab==="calc"){ v.innerHTML = renderCalc(); fillCalcTable(); fillSheet(); fillLabor(); fillU(); fillSewer(); }
  else if(S.tab==="struct") v.innerHTML = renderStruct();
  else if(S.tab==="tools"){ v.innerHTML = renderTools(); fillCad(); bindLocal("#cadq", val => { S.cadq = val; fillCad(); }); }
}
function setTopH(){ document.documentElement.style.setProperty("--topH", $("#top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);

readHash(); render(); setTopH();
